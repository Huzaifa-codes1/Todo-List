<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>My Todo List</h1>
        <div class="todo-input">
            <input type="text" id="input" placeholder="Whats need to be done?">
            <button id="add-btn"> Add</button>
        </div>

        <ul id="ultodo-list"></ul>

        <P id="para"></P>

        <button id="all-btn">All</button>
        <button id="active-btn">Active</button>

        <button id="comp-btn">Completed</button>
        <button id="clear-btn" class="hide" >clear all</button>


    </div>


    <script src="script.js"></script>
</body>

</html>
